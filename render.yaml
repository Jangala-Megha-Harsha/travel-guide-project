services:
  - type: web
    name: india-ai-travel-guide-api
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MURF_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
